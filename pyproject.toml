[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-devops-coach"
version = "0.1.0"
description = "A bilingual, evidence-based Codex coach for an 18-month remote DevOps career transition."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fichil" }]
keywords = ["devops", "aws", "roadmap", "career-change", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
devops-coach = "devops_coach.cli:main"

[project.urls]
Homepage = "https://github.com/fichil/remote-devops-engineer-roadmap"
Repository = "https://github.com/fichil/remote-devops-engineer-roadmap"
Issues = "https://github.com/fichil/remote-devops-engineer-roadmap/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
