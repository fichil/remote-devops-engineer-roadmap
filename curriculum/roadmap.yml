schema_version: 1
title:
  zh: 18个月海外远程 DevOps 转行路线
  en: 18-Month Remote DevOps Career Roadmap
principles:
  - 证据优先：命令、代码、测试、Runbook 或演示比“看过课程”更重要。
  - 先修优先：没有通过基础门槛，不用新工具掩盖知识缺口。
  - 成本受控：云实验先估价、设告警、获确认，结束后销毁。
  - 双语渐进：中文保证理解，英文逐步成为文档、协作和面试语言。
  - 市场校准：每月根据真实岗位调整选修权重，不追逐短期工具热点。

phases:
  - id: foundations
    title_zh: 计算机、Linux 与英语基础
    title_en: Computer, Linux, and English Foundations
    week_start: 1
    week_end: 13
    prerequisites: []
    outcomes:
      - 能在 WSL2 Ubuntu 中安全完成文件、权限、进程、包与网络操作。
      - 能用 Git/GitHub 保存可审查的学习证据，并解释基础 Web 请求链路。
    labs:
      - Linux 故障排查手册与可重复命令记录
    english_output: 用简单英语做五分钟环境介绍并写每周状态更新。
    gate: 独立完成一次 Linux 权限、进程和网络组合排障，掌握度不低于 4/5。
    weekly_focus:
      - {week: 1, title_zh: 学习系统、WSL2 与终端, title_en: "Learning System, WSL2, and Terminal"}
      - {week: 2, title_zh: Linux 文件、目录与路径, title_en: "Linux Files, Directories, and Paths"}
      - {week: 3, title_zh: 用户、组与文件权限, title_en: "Users, Groups, and Permissions"}
      - {week: 4, title_zh: 进程、服务与软件包, title_en: "Processes, Services, and Packages"}
      - {week: 5, title_zh: Git 本地工作流, title_en: Local Git Workflow}
      - {week: 6, title_zh: GitHub 协作与 Markdown, title_en: GitHub Collaboration and Markdown}
      - {week: 7, title_zh: 计算机硬件、操作系统与虚拟化, title_en: "Hardware, Operating Systems, and Virtualization"}
      - {week: 8, title_zh: IP、子网与路由基础, title_en: "IP, Subnets, and Routing Basics"}
      - {week: 9, title_zh: DNS、端口与常见协议, title_en: "DNS, Ports, and Common Protocols"}
      - {week: 10, title_zh: HTTP、HTTPS 与 TLS, title_en: "HTTP, HTTPS, and TLS"}
      - {week: 11, title_zh: 日志、退出码与基础排障, title_en: "Logs, Exit Codes, and Basic Troubleshooting"}
      - {week: 12, title_zh: Linux 排障手册项目, title_en: Linux Troubleshooting Runbook Project}
      - {week: 13, title_zh: 基础阶段复测与英文演示, title_en: Foundation Gate and English Demo}

  - id: systems_automation
    title_zh: Linux 管理、脚本与系统自动化
    title_en: Linux Administration, Scripting, and Automation
    week_start: 14
    week_end: 26
    prerequisites: [foundations]
    outcomes:
      - 能用 Bash 与 Python 自动化重复任务并为关键逻辑编写测试。
      - 能配置 SSH、Nginx、计划任务和基础安全控制，并进行系统级排障。
    labs:
      - Bash 与 Python 自动化工具箱
      - 可重复部署的 Nginx 服务与 Runbook
    english_output: 用英语编写脚本 README、故障报告和异步状态更新。
    gate: 从空白环境部署服务、制造故障、定位根因并用脚本恢复。
    weekly_focus:
      - {week: 14, title_zh: Bash 变量、管道与退出码, title_en: "Bash Variables, Pipes, and Exit Codes"}
      - {week: 15, title_zh: Bash 条件、循环与函数, title_en: "Bash Conditions, Loops, and Functions"}
      - {week: 16, title_zh: Python 基础与虚拟环境, title_en: Python Basics and Virtual Environments}
      - {week: 17, title_zh: Python 文件、JSON 与命令行, title_en: "Python Files, JSON, and CLI Tools"}
      - {week: 18, title_zh: 自动化测试与错误处理, title_en: Automated Tests and Error Handling}
      - {week: 19, title_zh: SSH、密钥与远程管理, title_en: "SSH, Keys, and Remote Administration"}
      - {week: 20, title_zh: systemd、日志与计划任务, title_en: "systemd, Logs, and Scheduled Jobs"}
      - {week: 21, title_zh: 存储、挂载与备份, title_en: "Storage, Mounts, and Backups"}
      - {week: 22, title_zh: Nginx 与反向代理, title_en: Nginx and Reverse Proxying}
      - {week: 23, title_zh: DNS、HTTP 与 TLS 深入排障, title_en: "DNS, HTTP, and TLS Troubleshooting"}
      - {week: 24, title_zh: 最小权限、补丁与基础加固, title_en: "Least Privilege, Patching, and Hardening"}
      - {week: 25, title_zh: 自动化工具箱项目, title_en: Automation Toolkit Project}
      - {week: 26, title_zh: 系统自动化阶段复测, title_en: Systems Automation Gate}

  - id: containers_cicd
    title_zh: 容器与持续交付
    title_en: Containers and Continuous Delivery
    week_start: 27
    week_end: 39
    prerequisites: [foundations, systems_automation]
    outcomes:
      - 能构建、调试并安全运行容器镜像与 Compose 应用。
      - 能设计带测试、制品、Secret 和回滚说明的 GitHub Actions 流水线。
    labs:
      - 带 CI/CD、版本发布与操作手册的容器化 Web 服务
    english_output: 用英语提交 Issue、PR、发布说明和五分钟项目演示。
    gate: 从 Git 提交到可验证部署全流程自动化，失败时能定位阶段和恢复。
    weekly_focus:
      - {week: 27, title_zh: 容器原理与 Docker CLI, title_en: Container Fundamentals and Docker CLI}
      - {week: 28, title_zh: Dockerfile 与镜像分层, title_en: Dockerfiles and Image Layers}
      - {week: 29, title_zh: 网络、卷与运行时配置, title_en: "Networks, Volumes, and Runtime Configuration"}
      - {week: 30, title_zh: Docker Compose 多服务应用, title_en: Multi-Service Apps with Docker Compose}
      - {week: 31, title_zh: 容器调试、性能与安全, title_en: "Container Debugging, Performance, and Security"}
      - {week: 32, title_zh: CI/CD 原理与质量门禁, title_en: CI/CD Principles and Quality Gates}
      - {week: 33, title_zh: GitHub Actions 工作流, title_en: GitHub Actions Workflows}
      - {week: 34, title_zh: 测试、缓存与构建制品, title_en: "Tests, Caching, and Build Artifacts"}
      - {week: 35, title_zh: Secrets、OIDC 与供应链基础, title_en: "Secrets, OIDC, and Supply Chain Basics"}
      - {week: 36, title_zh: 版本、发布与回滚, title_en: "Versioning, Releases, and Rollbacks"}
      - {week: 37, title_zh: 容器化服务项目实现, title_en: Containerized Service Implementation}
      - {week: 38, title_zh: 流水线故障演练与 Runbook, title_en: Pipeline Failure Drills and Runbooks}
      - {week: 39, title_zh: 容器与交付阶段复测, title_en: Containers and Delivery Gate}

  - id: aws_iac
    title_zh: AWS 云平台与基础设施即代码
    title_en: AWS Cloud and Infrastructure as Code
    week_start: 40
    week_end: 52
    prerequisites: [foundations, systems_automation, containers_cicd]
    outcomes:
      - 能在成本保护下设计并操作安全、可恢复的 AWS 基础环境。
      - 能用 Terraform 创建、变更和销毁环境，并解释状态与模块边界。
    labs:
      - Terraform 管理的 AWS 网络、计算、存储、监控与预算告警
    english_output: 用英语编写架构说明、成本估算、变更计划和项目演示。
    gate: 经成本确认后从零创建环境、验证服务、展示监控并完整销毁。
    weekly_focus:
      - {week: 40, title_zh: 云模型、AWS 账号与成本保护, title_en: "Cloud Models, AWS Accounts, and Cost Guardrails"}
      - {week: 41, title_zh: IAM、身份与最小权限, title_en: "IAM, Identity, and Least Privilege"}
      - {week: 42, title_zh: VPC、子网、路由与安全组, title_en: "VPCs, Subnets, Routes, and Security Groups"}
      - {week: 43, title_zh: EC2、负载均衡与自动伸缩, title_en: "EC2, Load Balancing, and Auto Scaling"}
      - {week: 44, title_zh: S3、生命周期与静态内容, title_en: "S3, Lifecycles, and Static Content"}
      - {week: 45, title_zh: RDS、备份与恢复, title_en: "RDS, Backups, and Recovery"}
      - {week: 46, title_zh: ECR、ECS 与容器部署, title_en: "ECR, ECS, and Container Deployment"}
      - {week: 47, title_zh: CloudWatch、日志、指标与告警, title_en: "CloudWatch Logs, Metrics, and Alarms"}
      - {week: 48, title_zh: Terraform 资源、状态与计划, title_en: "Terraform Resources, State, and Plans"}
      - {week: 49, title_zh: Terraform 模块与远程状态, title_en: Terraform Modules and Remote State}
      - {week: 50, title_zh: CI 中的 IaC 与策略检查, title_en: IaC and Policy Checks in CI}
      - {week: 51, title_zh: AWS Terraform 作品项目, title_en: AWS Terraform Portfolio Project}
      - {week: 52, title_zh: 云与 IaC 阶段复测及认证决策, title_en: Cloud and IaC Gate with Certification Decision}

  - id: kubernetes_sre
    title_zh: Kubernetes、可观测性与 SRE
    title_en: Kubernetes, Observability, and SRE
    week_start: 53
    week_end: 65
    prerequisites: [containers_cicd, aws_iac]
    outcomes:
      - 能在本地集群部署、升级、调试和恢复 Kubernetes 工作负载。
      - 能定义 SLI/SLO、监控、日志和告警，并主持一次事故复盘。
    labs:
      - Kubernetes、Helm、GitOps 与 Prometheus/Grafana/Loki 可观测性实验室
    english_output: 用英语编写告警说明、事故时间线、复盘和技术演示。
    gate: 在本地集群完成一次受控故障、告警、定位、恢复和无责复盘。
    weekly_focus:
      - {week: 53, title_zh: Kubernetes 架构与 kubectl, title_en: Kubernetes Architecture and kubectl}
      - {week: 54, title_zh: Pod、Deployment 与 Service, title_en: "Pods, Deployments, and Services"}
      - {week: 55, title_zh: ConfigMap、Secret 与存储, title_en: "ConfigMaps, Secrets, and Storage"}
      - {week: 56, title_zh: 调度、资源、探针与伸缩, title_en: "Scheduling, Resources, Probes, and Scaling"}
      - {week: 57, title_zh: 网络、Ingress 与 TLS, title_en: "Networking, Ingress, and TLS"}
      - {week: 58, title_zh: Helm 包管理, title_en: Package Management with Helm}
      - {week: 59, title_zh: GitOps 与 Argo CD, title_en: GitOps with Argo CD}
      - {week: 60, title_zh: Prometheus 指标与 PromQL, title_en: Prometheus Metrics and PromQL}
      - {week: 61, title_zh: Grafana 仪表盘与告警, title_en: Grafana Dashboards and Alerting}
      - {week: 62, title_zh: Loki 日志与故障关联, title_en: Loki Logs and Incident Correlation}
      - {week: 63, title_zh: SLI、SLO、错误预算与值班, title_en: "SLIs, SLOs, Error Budgets, and On-Call"}
      - {week: 64, title_zh: Kubernetes 事故演练项目, title_en: Kubernetes Incident Drill Project}
      - {week: 65, title_zh: Kubernetes 与 SRE 阶段复测, title_en: Kubernetes and SRE Gate}

  - id: career_capstone
    title_zh: 生产级综合项目与海外求职
    title_en: Production Capstone and Global Job Search
    week_start: 66
    week_end: 78
    prerequisites: [systems_automation, containers_cicd, aws_iac, kubernetes_sre]
    outcomes:
      - 能展示端到端平台、权衡、安全、可靠性、成本与恢复能力。
      - 能用英语完成异步协作、技术面试、行为面试和远程岗位申请。
    labs:
      - 端到端 DevOps 平台综合项目
      - 三轮英文模拟面试与公开技术演示
    english_output: 全英文 README、架构演示、事故复盘、简历、求职信和面试回答。
    gate: 六个作品、三次有效开源贡献、双语简历和三轮模拟面试达到 4/5。
    weekly_focus:
      - {week: 66, title_zh: 综合项目需求与成功指标, title_en: Capstone Requirements and Success Metrics}
      - {week: 67, title_zh: 架构决策与威胁建模, title_en: Architecture Decisions and Threat Modeling}
      - {week: 68, title_zh: IaC、CI/CD 与环境交付, title_en: "IaC, CI/CD, and Environment Delivery"}
      - {week: 69, title_zh: 可观测性、SLO 与告警, title_en: "Observability, SLOs, and Alerts"}
      - {week: 70, title_zh: 备份、灾难恢复与演练, title_en: "Backup, Disaster Recovery, and Drills"}
      - {week: 71, title_zh: 安全、成本与性能审查, title_en: "Security, Cost, and Performance Review"}
      - {week: 72, title_zh: 英文文档与项目演示, title_en: English Documentation and Project Demo}
      - {week: 73, title_zh: 开源贡献冲刺, title_en: Open Source Contribution Sprint}
      - {week: 74, title_zh: 英文简历、GitHub 与职业主页, title_en: "English Resume, GitHub, and Professional Profile"}
      - {week: 75, title_zh: Linux、网络与云技术面试, title_en: "Linux, Networking, and Cloud Interviews"}
      - {week: 76, title_zh: 系统设计、事故与行为面试, title_en: "System Design, Incident, and Behavioral Interviews"}
      - {week: 77, title_zh: 海外岗位定制投递与复盘, title_en: Tailored Global Applications and Review}
      - {week: 78, title_zh: 最终能力门槛与后续路线, title_en: Final Readiness Gate and Next Roadmap}

training_blueprints:
  - week: 5
    project:
      id: local-git-change-control
      goal: 在连续的本地配置变更中建立工作区、暂存区、HEAD 与提交范围的可靠心智模型。
      environment: 教练在 private/labs/YYYY-Www/ 中准备的本地 Git 工作仓库；周一至周四复用同一状态，周五从本地裸远程取得全新副本。
      starting_state: 教练创建种子文件并完成基线提交；学习者接手一个仅允许修改测试配置与验证记录的本地变更单。
      seed_files:
        README.md: |
          # Local timeout change
          This repository is a local training service. No real service is deployed.
        deploy/app.conf: |
          environment=test
          timeout=30
        notes/verification.txt: |
          Expected check: timeout value is visible in the test configuration.
      acceptance_criteria:
        - 能根据实际差异区分工作区、暂存区和 HEAD 中的内容。
        - 能按变更目标选择明确文件与明确内容形成可审查提交。
        - 能在新条件下独立恢复误操作并说明验证证据。
        - 能用 2–4 句英语完成真实变更交接。
      safety_boundaries:
        - 只操作 private/labs/YYYY-Www/，不得修改学习系统仓库。
        - 不使用强制推送、自动 stash、硬重置或无法说明影响的清理命令。
        - 教练只准备和验证环境，不替学习者构造最终命令。
      core_concepts:
        - 工作区、暂存区、HEAD 与提交对象
        - 路径限定的差异、暂存与提交范围
        - 分支指针、可恢复操作与证据链
      friday_variation: 教练把本周裸远程推进到一个包含额外文档变更的新基线；学习者从全新副本中只交付获授权的配置修改，并证明未夹带文档变化。
    missions:
      - codename: State Map
        scenario: 接手人看到配置文件和验证记录处于不同 Git 状态，必须先判断每份内容位于哪一层再决定动作。
        learning_goal: 用观察到的差异建立工作区、暂存区与 HEAD 的内容地图。
        concept_prompt: 如果一个文件在暂存后再次修改，哪两个比较面会出现不同内容？
        guided_practice: 先讲解工作树、暂存区和提交历史的用途与关系，完整示范只读检查命令及输出类型，再带领学习者检查本地副本并解释三层实际内容。
        independent_delivery: 教练改变两个文件的状态组合且不提供完整命令；学习者独立写出命令、预测、实际结果和解释，并用 2–4 句英语交接当前状态与安全下一步。
      - codename: Selective Stage
        scenario: 第一次配置修改已获授权，随后出现尚未批准的第二次修改，提交必须只包含获授权内容。
        learning_goal: 理解暂存是内容快照而不是“文件永久进入提交”的标签。
        concept_prompt: 暂存后再次编辑同一文件时，普通提交会包含哪一个版本？
        guided_practice: 先用示例演示修改、暂存和提交如何影响三个区域，拆解命令与范围参数；再带领学习者选择暂存内容、执行并解释实际提交范围。
        independent_delivery: 换成验证记录中一行获批、一行未获批的新条件；学习者无完整命令提示独立完成选择、预测、执行、验证和解释，再写 2–4 句英语说明提交范围。
      - codename: Commit Scope Incident
        scenario: 仓库同时存在已跟踪配置修改和未跟踪验证文件，同事建议使用会扩大范围的快捷提交方式。
        learning_goal: 根据业务授权选择提交范围，并识别快捷选项的夹带与遗漏风险。
        concept_prompt: 当目标只允许一个文件的已暂存内容时，自动纳入全部已跟踪修改是否安全？
        guided_practice: 先讲清授权边界并示范不同提交方式和只读比较；再让学习者对范围差异作一次有依据的预测，实际核对并解释，未知参数直接讲解。
        independent_delivery: 教练增加另一个已跟踪但无关的修改；学习者独立形成目标提交并提交前后验证，交付命令、预测、结果、解释及 2–4 句英语 PR 更新。
      - codename: Local Recovery
        scenario: 本地提交意外包含未批准内容，但尚未推送，必须在保留合法修改的前提下恢复可审查状态。
        learning_goal: 依据提交是否共享选择可恢复方案，并验证对象与文件内容均符合预期。
        concept_prompt: 尚未共享的错误提交与已经共享的提交是否应使用同一种修复策略？
        guided_practice: 先用可恢复示例讲解保留、撤回和历史的关系并示范恢复命令；再带领学习者选择目标范围，核对操作前后差异，错误预测用观察修正。
        independent_delivery: 新条件改为正确提交之后还有一个无关本地提交；学习者不获完整命令，自主选择安全恢复路径，提供预测、动作、结果、解释和 2–4 句英语事故更新。
      - codename: Fresh Clone Delivery
        scenario: 另一位工程师只能从本地裸远程取得全新副本，要求复现本周变更且不依赖旧工作区状态。
        learning_goal: 在全新副本中独立完成范围确认、变更、提交和可重复验证。
        concept_prompt: 如果旧工作区中存在未提交证据，全新副本会自动包含这些证据吗？
        guided_practice: 先演示从新副本按交付标准复现的过程，讲清路径、依赖和命令；再带领学习者复现并解释结果，本阶段不评分，独立考核另换条件。
        independent_delivery: 使用本周 friday_variation 且不给完整命令；学习者独立提交命令、预测、实际结果、解释与验证证据，并写 2–4 句英语交付说明。

  - week: 6
    project:
      id: local-pr-collaboration
      goal: 先在本地仓库与裸远程中理解分支、远程跟踪、差异和 PR 审查边界，再进行真实 GitHub 只读核验。
      environment: private/labs/YYYY-Www/ 下的工作仓库和本地裸远程；周一至周四连续使用，周五从裸远程全新克隆；真实 GitHub 只允许只读查询。
      starting_state: 教练把 main 基线推入本地裸远程，并准备一个文档变更请求；学习者不得在学习系统仓库或外部 GitHub 创建资源。
      seed_files:
        README.md: |
          # Local web service
          Deployment command: start-service.ps1
        deploy/app.conf: |
          environment=test
          timeout=30
        docs/change-request.md: |
          Replace the README deployment command with start-app.ps1.
          Application configuration is out of scope.
      acceptance_criteria:
        - 能解释本地分支、远程跟踪分支、默认分支和 PR 的关系。
        - 能以本地分支差异判断 Markdown 变更是否越过授权范围。
        - 能把 CI、审批与业务授权视为独立门禁。
        - 能在只读 GitHub 核验前说明查询目标并脱敏解释结果。
      safety_boundaries:
        - 不修改学习系统仓库，不创建外部仓库、PR、Issue 或评论。
        - GitHub 操作仅限只读；不得合并、审批、推送或更改分支保护。
        - 不隐藏诊断输出；展示前先移除账号、仓库名、令牌和私有地址。
      core_concepts:
        - 本地仓库、本地分支、本地裸远程、远程跟踪引用与默认分支
        - Markdown 差异、PR 变更集与审查范围
        - CI、审批、授权与合并条件
      friday_variation: 裸远程新增一个紧急修正文档提交并改变默认分支领先关系；学习者从新副本重建功能分支，排除越界配置修改并给出不合并或可合并结论。
    missions:
      - codename: Remote Mental Model
        scenario: 同事把本地 main、远程 main 和 PR 当成同一个对象，导致无法说明变更到底在哪里。
        learning_goal: 用本地裸远程建立提交可达性、分支和远程跟踪引用的心智模型。
        concept_prompt: 本地功能分支新增提交后，本地裸远程是否会自动出现该提交？
        guided_practice: 先用例子讲清本地仓库、本地远程、分支和 PR 的关系，示范只读查询并拆解字段；再带领学习者画出对象关系、操作并解释，不用复制命令代替理解。
        independent_delivery: 教练改变一个分支的领先关系；学习者独立选择命令、预测并解释实际提交可达性，再用 2–4 句英语说明分支状态和下一步。
      - codename: Markdown Scope
        scenario: 文档工单只允许替换 README 的部署命令，但功能分支还出现应用配置差异。
        learning_goal: 通过变更请求、文件差异和 Markdown 渲染预期界定 PR 范围。
        concept_prompt: 当 CI 通过但配置文件越过工单范围时，PR 是否已具备合并条件？
        guided_practice: 先示范如何以本地分支差异证明目标范围，讲清比较命令和参数；再带领学习者选择证据、执行并解释它支持或反驳的结论。
        independent_delivery: 新条件加入一个看似文档实为脚本行为变化的文件；学习者无完整命令提示独立审查、预测、验证、解释，并写 2–4 句英语 review comment。
      - codename: Review Set
        scenario: PR 标题和描述都声称仅改文档，审查人必须确认完整提交范围而不是相信文字摘要。
        learning_goal: 以基线到功能分支的完整差异审查提交集合、文件集合和内容。
        concept_prompt: 只查看最后一个提交能否证明整个功能分支没有更早的越界修改？
        guided_practice: 先用例子讲解比较两端如何决定变更集，示范只读比较；再带领学习者对换一端的差异作判断并实际验证，不要求猜陌生命令。
        independent_delivery: 教练把越界修改放入较早提交而把最后提交改成纯文档；学习者独立找出证据并交付命令、预测、结果、解释及 2–4 句英语审查结论。
      - codename: Read-only GitHub Gate
        scenario: 本地证据已理解，团队要求只读确认真实 GitHub 默认分支、CI 和审批概念，不允许执行任何写操作。
        learning_goal: 在查询前明确字段、隐私边界和失败诊断，而不是只回报退出码。
        concept_prompt: 只知道命令退出码为零能否证明目标 PR 已满足业务授权？
        guided_practice: 先讲解查询对象、字段和脱敏方法，完整拆解只读查询示例；再带领学习者查询并解释证据边界，错误文本脱敏后保留，不只报告退出码。
        independent_delivery: 改为核验另一个公开只读字段且不给完整查询；学习者独立选择方法，提交预测、脱敏结果和解释，并用 2–4 句英语说明证据局限。
      - codename: Local PR Boss
        scenario: 接手人必须从本地裸远程的新副本独立重建一个可审查的文档分支，并给出模拟 PR 门禁结论。
        learning_goal: 整合远程模型、范围审查、Markdown、CI 与审批边界完成可重复交付。
        concept_prompt: 新副本中的功能分支与默认分支比较基线选错时，审查结论是否仍可靠？
        guided_practice: 先演示按业务目标组织本地复现和验收证据，讲解陌生步骤；再带领学习者操作并解释，本阶段不评分，最终另给无提示变化题。
        independent_delivery: 使用 friday_variation，在无完整命令下独立给出命令、预测、结果、解释、门禁结论和证据，并写 2–4 句英语 PR handoff。

  - week: 7
    project:
      id: workstation-capacity-assessment
      goal: 为一台本地开发工作站制作可验证的硬件、操作系统与虚拟化容量评估，不凭产品名称猜测能力。
      environment: private/labs/YYYY-Www/ 中的只读采集与脱敏报告项目；允许读取本机和 WSL 的非敏感系统信息，不要求管理员权限。
      starting_state: 教练准备容量需求和空白资产记录；学习者逐日补齐经过解释的证据，周五在新副本处理不同工作负载要求。
      seed_files:
        README.md: |
          # Workstation capacity assessment
          Use only non-sensitive, read-only system evidence.
        requirements/workload.yml: |
          workload: local-ci-runner
          cpu_cores_min: 4
          memory_gb_min: 8
          disk_free_gb_min: 20
        evidence/inventory.md: |
          # Sanitized inventory
          Evidence is not collected yet.
      acceptance_criteria:
        - 能区分硬件资源、宿主操作系统、客户机与虚拟化层。
        - 能把 CPU、内存和存储证据与工作负载需求逐项对应。
        - 能识别采集结果中的隐私字段并在交接前脱敏。
        - 能在新工作负载条件下独立给出有证据的容量结论。
      safety_boundaries:
        - 仅运行只读查询，不更改 BIOS、Hyper-V、WSL、驱动或系统资源配置。
        - 不记录序列号、用户名、主机名、设备 ID、网络标识或私有路径。
        - 只在 private/labs/YYYY-Www/ 保存实验结果，不修改学习系统仓库。
      core_concepts:
        - CPU、内存、存储和体系结构
        - 内核、操作系统、宿主机、客户机与虚拟机管理器
        - 资源容量、开销、共享与隔离
      friday_variation: 新副本中的需求改为同时运行两个隔离任务且磁盘要求更高；学习者必须重新评估瓶颈，不能复用周四结论。
    missions:
      - codename: Layer Map
        scenario: 工单把 Windows、WSL、Linux 内核和物理 CPU 混称为“服务器”，容量判断失去对象边界。
        learning_goal: 画出硬件、宿主系统、虚拟化层和客户环境的层次关系。
        concept_prompt: WSL 中看到的 Linux 内核版本是否等同于物理主机的硬件型号？
        guided_practice: 先讲清物理硬件、Windows 宿主系统、WSL2 边界、Linux 内核和 Ubuntu 发行版的关系。Linux 内核负责进程、内存等核心管理；Ubuntu 发行版提供围绕内核运行的工具和软件环境。保留已有层次证据，从尚未理解处接续：解释 uname -r 查询当前运行的内核版本，/etc/os-release 记录发行版身份和版本，完整拆解并示范查询命令后一次带领一项实际操作。普通读取不修改这些配置；若进入已停止的 Ubuntu 会启动运行环境，先说明运行状态变化与配置变更的区别。不得猜具体版本号，由学习者据真实输出解释。
        independent_delivery: 教练换成容器与虚拟机的边界比较；学习者独立查询、预测、记录结果和解释，并写 2–4 句英语环境说明。
      - codename: Resource Baseline
        scenario: 团队准备运行本地 CI runner，需要确认 CPU 与内存是否满足最低要求而不暴露设备身份。
        learning_goal: 把资源量、当前可用量和工作负载最低需求分开比较。
        concept_prompt: 物理内存总量超过最低值是否足以证明两个并发任务都能稳定运行？
        guided_practice: 先讲解容量、总量和可用量及其观察范围，示范只读采集命令和字段；再带领学习者采集并解释差别，动态可用量变化不等于硬件配置变化。
        independent_delivery: 新条件增加并发和预留开销；学习者无完整命令独立采集、计算、解释结论，并用 2–4 句英语提交容量风险。
      - codename: Storage Boundary
        scenario: 工作负载需要临时制品空间，但报告把磁盘容量、卷容量和目录所在文件系统混为一谈。
        learning_goal: 将目标目录映射到实际文件系统，并比较可用空间与需求。
        concept_prompt: 另一个卷存在空闲空间是否必然能供目标目录中的任务使用？
        guided_practice: 先讲解目录、挂载点、文件系统和宿主卷的关系，完整示范只读定位方法；再带领学习者检查目标目录所在卷并解释证据，不要求猜陌生参数。
        independent_delivery: 教练把输出目录移到另一个实验路径；学习者独立判断文件系统与余量，提供预测、动作、结果、解释及 2–4 句英语结论。
      - codename: Virtualization Tradeoff
        scenario: 同事建议为隔离性增加虚拟环境，但未核算虚拟化开销与共享资源竞争。
        learning_goal: 根据隔离需求与资源开销比较进程、容器概念和虚拟机方案。
        concept_prompt: 隔离层增加后，可供工作负载使用的资源是否会无成本保持不变？
        guided_practice: 先用示例比较虚拟机和容器的隔离、内核共享与资源边界；再带领学习者结合已有证据作选择并解释取舍，不替学习者写最终结论。
        independent_delivery: 新条件强调不同信任级别而非性能；学习者独立权衡并引用证据，提交解释和 2–4 句英语建议。
      - codename: Capacity Boss
        scenario: 新接手人必须在全新副本中依据需求和脱敏系统证据作出 go/no-go 容量判断。
        learning_goal: 独立完成层次识别、资源采集、需求比较、风险说明和可重复交接。
        concept_prompt: 当一项关键指标无法安全采集时，没有证据是否可以按“满足”处理？
        guided_practice: 先示范容量交接如何区分硬件上限、当前可用量和虚拟化范围，讲解采集和验证步骤；再带领学习者操作、解释并练习交接，独立阶段另换条件。
        independent_delivery: 使用 friday_variation 且不给完整命令；学习者独立提交命令或方法、预测、脱敏结果、解释和 go/no-go 结论，并写 2–4 句英语交付。

  - week: 8
    project:
      id: branch-office-routing-plan
      goal: 为完全本地的分支办公室拓扑验证 IP、子网、网关和路由判断，不改动真实网络配置。
      environment: private/labs/YYYY-Www/ 中的静态拓扑、地址计算与只读本机路由证据；禁止创建或修改真实路由。
      starting_state: 教练提供两个网段、三台模拟主机和一条缺失路由的拓扑；学习者连续补齐计算、验证与故障解释。
      seed_files:
        README.md: |
          # Branch office routing plan
          This is an offline topology. Do not change host networking.
        topology/network.yml: |
          office_a: 192.0.2.0/29
          office_b: 198.51.100.0/29
          router_a: 192.0.2.1
          router_b: 198.51.100.1
        requests/connectivity.md: |
          app-a must reach app-b through the documented gateways.
      acceptance_criteria:
        - 能从前缀计算网络地址、主机范围和广播地址。
        - 能依据目的地址解释最长前缀匹配与默认路由。
        - 能从源、目标、网关和返回路径形成可验证假设。
        - 能在变化拓扑中独立定位地址或路由错误。
      safety_boundaries:
        - 不修改本机 IP、DNS、网关、防火墙或路由表。
        - 仅使用文档保留地址与回环地址，不扫描外部网络。
        - 所有输出先移除真实接口名、MAC、主机名和私有地址。
      core_concepts:
        - IPv4 地址、CIDR、网络地址、广播地址与主机范围
        - 网关、路由表、最长前缀匹配与默认路由
        - 正向路径、返回路径和分层验证
      friday_variation: 新副本把 office_b 改为更小子网并加入一条更具体路由；学习者必须重新计算地址边界并判断实际选路。
    missions:
      - codename: Address Roles
        scenario: 工单把网络地址、主机地址和网关地址混用，导致模拟主机配置无效。
        learning_goal: 根据 CIDR 判断地址角色和可分配边界。
        concept_prompt: 位于子网广播地址上的模拟主机能否作为普通主机地址使用？
        guided_practice: 先示范完整算例，讲清 IP、前缀、网络地址和主机地址的关系，再带领学习者计算并解释地址角色；不要在概念尚未教过时要求猜数值。
        independent_delivery: 教练换一个前缀和候选地址；学习者独立给出计算方法、预测、结果、解释，并写 2–4 句英语地址审查意见。
      - codename: Subnet Allocation
        scenario: 两类服务需要隔离地址空间，分配方案可能重叠或浪费无法满足后续容量。
        learning_goal: 用需求数量和前缀边界设计不重叠的小型子网。
        concept_prompt: 两个 CIDR 起始地址不同是否足以证明它们不重叠？
        guided_practice: 先演示从容量需求推导子网范围和检查重叠的算例，再带领学习者计算并解释边界；可对候选范围是否重叠作一次有依据的预测。
        independent_delivery: 新条件增加保留地址并缩小地址池；学习者无完整命令独立分配、验证和解释，再用 2–4 句英语交付规划。
      - codename: Route Choice
        scenario: 路由表同时包含默认路由和更具体路由，同事按出现顺序猜测数据包出口。
        learning_goal: 用目的地址和最长前缀匹配解释路由选择。
        concept_prompt: 更具体路由排在默认路由后面时，数据包是否一定走默认路由？
        guided_practice: 先用静态路由表示范最长前缀匹配，拆解匹配步骤；再带领学习者判断不同目的地址的路由并核对，错误预测通过表中证据修正。
        independent_delivery: 教练新增一条覆盖部分地址的路由；学习者独立选择、预测、验证和解释，并写 2–4 句英语 route handoff。
      - codename: Return Path Incident
        scenario: 正向路径文档看似正确，但响应无法返回源主机，团队只检查了出站网关。
        learning_goal: 将连通性拆为正向与返回路径并定位缺失证据。
        concept_prompt: 请求能够到达目标是否足以证明双向通信一定成功？
        guided_practice: 先用离线拓扑讲清请求与返回路径，示范如何定位路径断点；再带领学习者提出一条故障假设、核对双向路径并解释实际证据。
        independent_delivery: 新条件把缺失项移到另一个网关；学习者独立提出假设、验证、结果和解释，并写 2–4 句英语 incident update。
      - codename: Routing Boss
        scenario: 交接人需要从新副本独立审查拓扑、地址分配和双向路由，给出可执行但不触碰真实网络的修正建议。
        learning_goal: 综合 CIDR、选路和返回路径完成安全的网络基础门禁。
        concept_prompt: 未验证目标地址属于哪个子网时，直接建议修改默认路由是否安全？
        guided_practice: 先示范离线拓扑的连通验收和安全边界，讲清必要计算与检查；再带领学习者完成复现并解释，本阶段不评分，独立阶段更换拓扑条件。
        independent_delivery: 使用 friday_variation，不提供完整命令或答案；学习者独立给出计算、预测、结果、解释和修正建议，并用 2–4 句英语交付。

  - week: 9
    project:
      id: loopback-name-service-diagnosis
      goal: 在仅绑定回环地址的实验服务中建立 DNS、端口、TCP/UDP 与应用协议的分层诊断方法。
      environment: private/labs/YYYY-Www/ 中的离线 DNS 记录、回环服务和连接证据；不监听外部接口、不扫描网络。
      starting_state: 教练提供模拟名称记录、服务清单和一个名称正确但端口错误的故障；学习者逐日形成分层证据链。
      seed_files:
        README.md: |
          # Loopback name and port lab
          All listeners must stay on 127.0.0.1.
        dns/records.yml: |
          api.lab.test: 127.0.0.1
          metrics.lab.test: 127.0.0.1
        services/expected.yml: |
          api:
            protocol: tcp
            port: 18080
          metrics:
            protocol: tcp
            port: 19090
      acceptance_criteria:
        - 能区分名称解析结果、网络地址、端口、传输协议和应用协议。
        - 能用回环监听与客户端结果证明端口状态，不把超时等同于单一根因。
        - 能根据 DNS、socket 和应用证据逐层缩小故障范围。
        - 能在变化端口与记录条件下独立诊断并交接。
      safety_boundaries:
        - 服务只绑定 127.0.0.1，不使用特权端口，不更改系统 hosts 或 DNS。
        - 不扫描外部地址，不关闭防火墙，不终止非实验进程。
        - 展示监听信息前移除真实 PID、用户名、主机名和非回环地址。
      core_concepts:
        - DNS 名称、记录、解析器与缓存
        - socket、端口、监听地址、TCP 与 UDP
        - 分层诊断与证据的充分性
      friday_variation: 新副本把一个服务从 TCP 改为 UDP 概念案例并让名称指向不同回环地址；学习者必须重新判断每层应观察什么，不能沿用旧端口结论。
    missions:
      - codename: Name Resolution Map
        scenario: 同事把名称存在、解析成功和服务可用视为同一件事，无法定位失败层次。
        learning_goal: 区分查询名称、返回记录和后续连接目标。
        concept_prompt: 名称正确解析为回环地址是否能证明目标端口已有服务监听？
        guided_practice: 先讲解 DNS 记录与解析结果能证明什么，完整示范离线记录的只读检查；再带领学习者查询、观察并解释证据边界。
        independent_delivery: 教练更换记录类型与目标；学习者独立选择方法、预测、结果和解释，并写 2–4 句英语 DNS handoff。
      - codename: Listener Evidence
        scenario: 客户端报告连接失败，但团队没有确认服务绑定地址和目标端口是否一致。
        learning_goal: 将监听地址、端口和进程证据与客户端目标对应起来。
        concept_prompt: 服务只监听另一个端口时，目标端口的连接失败是否应归因于 DNS？
        guided_practice: 先讲清 socket 的地址、端口、协议和状态，完整示范回环检查及字段解释；再带领学习者观察真实结果，保留脱敏错误用于分析。
        independent_delivery: 新条件变成服务监听正确端口但不同回环地址；学习者无完整命令独立验证、解释并写 2–4 句英语状态更新。
      - codename: TCP UDP Boundary
        scenario: 工单只写了端口号，没有说明 TCP 或 UDP，检查结果因此互相矛盾。
        learning_goal: 理解端口号必须与传输协议和地址共同确定 socket。
        concept_prompt: 相同数字端口上的 TCP 监听能否证明 UDP 服务也已就绪？
        guided_practice: 先用回环示例讲清 TCP 与 UDP 的独立状态，示范安全观察方法；再带领学习者判断一个协议成功能否证明另一个成功，并用观察验证。
        independent_delivery: 教练交换预期协议并保持端口号不变；学习者独立提交方法、预测、结果、解释和 2–4 句英语诊断。
      - codename: Layered Protocol Incident
        scenario: 名称、地址和端口均可达，但客户端发送了服务不理解的应用协议内容。
        learning_goal: 识别传输连接成功与应用请求成功之间的边界。
        concept_prompt: TCP 建连成功是否足以证明应用层请求格式正确？
        guided_practice: 先示范如何区分解析、传输和应用层的成功条件；再带领学习者对本地样本提出一条故障假设，执行检查并解释证据，不猜未知参数。
        independent_delivery: 新条件使用正确协议但错误请求目标；学习者独立定位、提供预测、证据和解释，并写 2–4 句英语 incident update。
      - codename: Name Port Boss
        scenario: 接手人从裸远程新副本启动不同回环服务，必须独立判断名称、传输层和应用层的真实状态。
        learning_goal: 用最小、安全、可重复证据完成 DNS 与端口综合诊断。
        concept_prompt: 在未确认协议类型前，只凭端口号相同能否判定配置一致？
        guided_practice: 先演示本地服务的逐层检查与交接结构，完整讲解陌生命令；再带领学习者复现并解释，本阶段不评分，最终另做无提示变化题。
        independent_delivery: 使用 friday_variation 且不给完整命令；学习者独立给出方法、预测、脱敏结果、解释和修正建议，并写 2–4 句英语交付。

  - week: 10
    project:
      id: local-http-tls-service
      goal: 在回环 Web 服务中理解 HTTP 请求响应和 TLS 身份验证，并用分层证据诊断安全连接故障。
      environment: private/labs/YYYY-Www/ 的本地回环 HTTP/HTTPS 实验；证书仅为短期实验材料，不访问真实生产端点。
      starting_state: 教练提供响应契约、路由说明和证书需求；逐日引入状态码、重定向、主机名与信任差异。
      seed_files:
        README.md: |
          # Local HTTP and TLS lab
          Bind only to loopback and trust no lab certificate system-wide.
        app/routes.yml: |
          health_path: /health
          expected_status: 200
          redirect_path: /old-health
        tls/requirements.md: |
          The test certificate must identify api.lab.test and remain lab-only.
      acceptance_criteria:
        - 能解释 URL、方法、路径、请求头、状态码、响应头和响应体的作用。
        - 能区分 TCP、TLS 握手、证书身份与 HTTP 应用响应。
        - 能在本地证书不受信任时安全验证而不污染系统信任库。
        - 能在变化路由或主机名条件下独立定位故障并交接。
      safety_boundaries:
        - 所有服务只绑定回环地址，不使用真实域名或生产证书。
        - 不把实验 CA 加入系统信任库，不记录或提交私钥，不关闭证书验证作为交付方案。
        - 不访问外部服务；错误证据脱敏后保留用于解释。
      core_concepts:
        - HTTP 请求行、头、状态码、响应体与重定向
        - HTTPS、TLS 握手、证书链、主机名与信任
        - 网络层、传输层、安全层和应用层诊断
      friday_variation: 新副本把健康路径和证书标识同时改变，但端口保持不变；学习者必须分别证明 HTTP 路由问题与 TLS 身份问题。
    missions:
      - codename: Request Anatomy
        scenario: 健康检查失败，工单只给出 URL，未区分方法、主机、端口和路径。
        learning_goal: 把 HTTP 请求拆成可独立验证的组成部分。
        concept_prompt: 主机和端口正确但路径错误时，服务能否返回非成功状态码？
        guided_practice: 先讲解 HTTP 方法、路径、请求头与请求体，示范本地请求并拆解命令；再带领学习者改变一项已讲过的条件，观察并解释结果差异。
        independent_delivery: 教练更换方法或路径之一；学习者独立构造请求、预测、观察结果和解释，并写 2–4 句英语 HTTP update。
      - codename: Response Evidence
        scenario: 客户端只说“有返回”，但团队不知道状态码、响应头和响应体是否符合验收契约。
        learning_goal: 使用完整响应证据判断成功、重定向和应用错误。
        concept_prompt: 收到响应体是否必然表示 HTTP 状态为成功？
        guided_practice: 先示范如何用状态码、响应头和响应体判断本地契约，解释完整查询命令；再带领学习者操作并说明每项证据的含义。
        independent_delivery: 新条件返回相似正文但错误状态码；学习者无完整命令独立验证、解释，并写 2–4 句英语 review note。
      - codename: TLS Identity
        scenario: 本地 TLS 服务可握手，但证书标识与请求主机名不一致，不能用“端口能连”判断安全。
        learning_goal: 区分加密通道、证书信任和服务身份匹配。
        concept_prompt: 证书由已知实验 CA 签发时，主机名不匹配是否仍应视为身份验证成功？
        guided_practice: 先讲清 TLS 握手、主机名、信任链和有效期，示范不含私钥的证书检查；再带领学习者观察并解释验证失败，禁止把关闭验证当修复。
        independent_delivery: 教练改为主机名正确但签发链未知；学习者独立判断、提供预测、结果和解释，并写 2–4 句英语 TLS handoff。
      - codename: Redirect Incident
        scenario: HTTP 入口返回重定向，跟随后的 HTTPS 请求因身份问题失败，团队只看到了最终错误。
        learning_goal: 重建每一跳的 URL、状态和 TLS 门禁形成时间线。
        concept_prompt: 自动跟随重定向后只看到最终失败，是否足以证明第一跳没有正常响应？
        guided_practice: 先用示例讲清请求每一跳及分段证据的用途，示范构建时间线；再带领学习者提出一条故障假设并验证，不替学习者写最终根因。
        independent_delivery: 新条件加入第二次重定向和错误路径；学习者独立定位，提交预测、结果、解释与 2–4 句英语 incident update。
      - codename: HTTP TLS Boss
        scenario: 新接手人必须从裸远程新副本启动本地服务并独立证明 URL、HTTP 响应和 TLS 身份是否满足契约。
        learning_goal: 综合请求响应与 TLS 证据完成安全的 Web 链路诊断。
        concept_prompt: 当 HTTP 内容正确但证书身份失败时，服务是否达到 HTTPS 验收标准？
        guided_practice: 先演示本地请求链路的检查、复现与验收，解释陌生步骤和安全边界；再带领学习者操作并解释，独立阶段另换条件。
        independent_delivery: 使用 friday_variation 且无完整命令；学习者独立提交请求或检查方法、预测、脱敏结果、解释和结论，并写 2–4 句英语交付。

  - week: 11
    project:
      id: batch-job-evidence-chain
      goal: 用日志、标准输出、标准错误和退出码重建一个本地批处理任务的故障证据链。
      environment: private/labs/YYYY-Www/ 中的静态日志与无害 PowerShell 检查脚本；不读取真实服务日志、不修改系统计划任务。
      starting_state: 教练提供一次成功运行和一次失败运行的交错日志，以及会对无效配置返回非零退出码的本地检查脚本。
      seed_files:
        README.md: |
          # Batch job evidence chain
          Diagnose the supplied local samples only.
        config/job.conf: |
          source=input/sample.txt
          destination=output/result.txt
        logs/job.log: |
          2026-01-01T00:00:00Z INFO run=101 start
          2026-01-01T00:00:01Z INFO run=101 complete exit=0
          2026-01-02T00:00:00Z INFO run=102 start
          2026-01-02T00:00:01Z ERROR run=102 destination_missing exit=2
        scripts/check-config.ps1: |
          param([string]$ConfigPath)
          if (-not (Test-Path -LiteralPath $ConfigPath)) { Write-Error "config_missing"; exit 2 }
          Write-Output "config_present"
          exit 0
      acceptance_criteria:
        - 能按运行标识和时间重建事件序列，不混合不同执行实例。
        - 能区分 stdout、stderr、日志级别和进程退出码各自证明的事实。
        - 能提出可证伪假设并以最小安全实验验证。
        - 能在新日志噪声和退出码条件下独立诊断与交接。
      safety_boundaries:
        - 只运行种子脚本和本地样本，不修改真实服务、计划任务或日志目录。
        - 不把错误输出丢弃；展示前脱敏路径、账号、令牌和基础设施标识。
        - 不根据单行 ERROR 自动执行修复，先确认运行实例与影响。
      core_concepts:
        - 时间线、运行关联标识与日志级别
        - stdout、stderr、退出码与调用方判断
        - 症状、假设、验证、根因和恢复证据
      friday_variation: 新副本加入一个退出码为零但业务结果缺失的运行，以及与故障无关的 ERROR 噪声；学习者必须避免把退出码或错误关键字当成唯一结论。
    missions:
      - codename: Timeline Reconstruction
        scenario: 多次任务运行的日志交错在同一文件，值班人把早期错误归到最新运行。
        learning_goal: 使用时间和运行标识重建单次执行的可靠时间线。
        concept_prompt: 两行日志时间相近但运行标识不同，是否可以视为同一次执行？
        guided_practice: 先讲解运行标识、时间范围和日志噪声，完整示范样本筛选命令；再带领学习者筛选并解释哪些证据属于目标运行。
        independent_delivery: 教练加入无序和重复日志；学习者独立重建时间线，提交方法、预测、结果、解释及 2–4 句英语事件摘要。
      - codename: Exit Contract
        scenario: 上游只检查是否出现 ERROR 文本，没有依据脚本退出契约判断自动化结果。
        learning_goal: 将退出码视为进程接口，同时验证它与业务结果是否一致。
        concept_prompt: 退出码为零是否单独足以证明预期输出文件已经产生？
        guided_practice: 先示范有效和无效输入如何影响输出通道与退出码，逐段拆解脚本；再带领学习者对一个输入变化作预测，执行安全样本并对照真实结果。
        independent_delivery: 新条件使用存在但内容无效的配置；学习者无完整命令独立验证，提交预测、实际输出、退出码解释和 2–4 句英语 handoff。
      - codename: Stream Diagnosis
        scenario: 自动化日志只有普通输出，失败诊断实际上写入了错误通道并被调用方遗漏。
        learning_goal: 观察并解释 stdout 与 stderr，而不是默认隐藏错误文本。
        concept_prompt: 只保存 stdout 时，进程失败是否可能留下空诊断文件？
        guided_practice: 先讲清标准输出、标准错误和重定向符号，完整示范本地捕获；再带领学习者操作并解释两个通道，保留脱敏错误用于分析。
        independent_delivery: 教练改变脚本使警告和结果分属不同通道；学习者独立捕获、预测、验证、解释并写 2–4 句英语诊断说明。
      - codename: Hypothesis Test
        scenario: 日志显示目标目录缺失，但根因可能是路径配置、运行目录或种子文件之一，不能直接猜修复。
        learning_goal: 把症状转换成一个可证伪假设并设计最小验证。
        concept_prompt: 能重现“目标不存在”是否已经证明配置文件中的路径就是根因？
        guided_practice: 先用可恢复示例讲清如何让假设可证伪并示范最小检查；再带领学习者选择一条故障假设、预测区分证据并验证，错误预测可以修正。
        independent_delivery: 新条件制造相同症状但不同原因；学习者独立提出假设、动作、预测、结果和解释，并写 2–4 句英语 incident update。
      - codename: Evidence Boss
        scenario: 新接手人从裸远程新副本面对含噪日志和变化脚本，必须独立给出可复核根因与恢复检查。
        learning_goal: 综合时间线、输出通道、退出契约和假设验证完成基础排障。
        concept_prompt: 只看到预期退出码但没有验证业务结果时，任务是否可以宣布恢复？
        guided_practice: 先演示从影响范围到诊断、恢复和交接的过程，完整讲解陌生命令；再带领学习者操作并解释，本阶段不评分，独立阶段更换故障条件。
        independent_delivery: 使用 friday_variation 且不给完整命令；学习者独立提交方法、预测、脱敏结果、解释、恢复验证及 2–4 句英语交接。

  - week: 12
    project:
      id: linux-troubleshooting-runbook
      goal: 把前几周的系统与网络诊断方法整理成另一位工程师可在安全本地环境复现的 Linux 排障 Runbook。
      environment: private/labs/YYYY-Www/ 中的 WSL 或等价本地 sandbox、静态案例和本地裸远程；不操作真实服务。
      starting_state: 教练提供一份缺少前置条件、预期结果和回滚说明的 Runbook 草稿，以及三个可安全复现的案例证据。
      seed_files:
        README.md: |
          # Linux troubleshooting runbook project
          The runbook must be reproducible in a local sandbox.
        runbook/troubleshoot.md: |
          # Troubleshooting
          Check the service and fix the problem.
        cases/symptoms.yml: |
          case_a: permission_denied
          case_b: process_not_listening
          case_c: name_resolves_but_http_fails
      acceptance_criteria:
        - Runbook 明确前置条件、影响、安全边界、检查顺序、预期与分支判断。
        - 每个修复步骤都有验证、失败处理和可行回滚，而不是命令清单。
        - 另一份全新副本可以仅依据文档重现诊断并得到相同结论。
        - 英文交付准确说明结果、证据、剩余风险和下一步。
      safety_boundaries:
        - 仅使用本地案例和 sandbox，不重启真实服务、不提权、不改真实网络。
        - 文档不包含个人信息、私有路径、凭据、真实仓库或基础设施标识。
        - 教练验证可复现性但不替学习者撰写最终 Runbook 内容。
      core_concepts:
        - Runbook 前置条件、决策点、预期结果与停止条件
        - 观察、假设、验证、修复、回滚和复验
        - 最小权限、可重复性与交接读者视角
      friday_variation: 新副本把三个案例的表面症状互换并移除一项工具依赖；学习者必须依靠决策证据而不是固定命令顺序完成复现。
    missions:
      - codename: Runbook Contract
        scenario: 草稿只有“检查并修复”的命令意图，接手人不知道适用环境、成功标准或何时停止。
        learning_goal: 定义 Runbook 的读者、前置条件、输入、输出和安全停止点。
        concept_prompt: 没有预期结果的检查步骤能否让接手人判断应该继续还是停止？
        guided_practice: 先用示例讲解接手人需要的目标、前提、步骤和验收信息，演示文档结构；再带领学习者整理自己的证据并写草稿，不代写最终交付。
        independent_delivery: 教练提供一个不同工具缺失的案例；学习者独立定义契约、验证可读性并解释结果，再写 2–4 句英语 Runbook introduction。
      - codename: Decision Path
        scenario: 相同“服务不可用”症状可能来自进程、端口、DNS 或 HTTP，线性命令清单会误导修复。
        learning_goal: 用低风险证据和判断分支组织诊断顺序。
        concept_prompt: 在尚未确认进程和监听状态时，直接修改 DNS 是否符合最小风险顺序？
        guided_practice: 先示范如何按成本和区分能力选择检查并形成决策路径；再带领学习者选择一个分支、核对证据并解释，不机械填写清单。
        independent_delivery: 新条件中 DNS 正常但 HTTP 路径错误；学习者无完整命令独立设计路径、验证和解释，并写 2–4 句英语 decision note。
      - codename: Safe Repair Step
        scenario: 草稿提出修改权限或重启服务，但没有变更范围、回滚和复验，无法用于值班。
        learning_goal: 把诊断结论转换成范围明确、可回滚、可验证的修复步骤。
        concept_prompt: 修复后症状消失但未验证原验收目标，是否可以关闭事件？
        guided_practice: 先用 sandbox 示例讲清预期状态、最小变更和回滚方法，示范验证步骤；再带领学习者对具体影响作预测、执行并解释实际结果。
        independent_delivery: 教练制造相同症状但限制不能重启；学习者独立选择替代方案，提交预测、动作、结果、解释和 2–4 句英语 change record。
      - codename: Peer Reproduction
        scenario: 作者本机可以执行 Runbook，但接手人的全新副本缺少隐含目录和前置工具。
        learning_goal: 以陌生读者视角发现隐藏依赖并证明文档可重复。
        concept_prompt: 作者记得手工准备过的目录但文档未写出时，成功复现能否证明 Runbook 完整？
        guided_practice: 先示范接手人仅按文档从新副本复现的验收方式；再让学习者提供自己的步骤供教练检验，依据真实失败证据改进，不猜未知失败点。
        independent_delivery: 新条件移除另一个隐含依赖；学习者独立修订、预测、复现、解释，并用 2–4 句英语说明兼容性改进。
      - codename: Runbook Boss
        scenario: 新工程师只拿到裸远程的新副本和变化案例，必须依靠 Runbook 完成诊断、恢复与交接。
        learning_goal: 独立交付经过新环境验证的 Linux 排障手册和周复盘证据。
        concept_prompt: 当 Runbook 只在原始案例上成功时，是否足以证明它能处理同类变化故障？
        guided_practice: 先演示新副本上的故障复现、文档验收与证据交付，讲解不懂的步骤；再带领学习者练习，完整提示后的案例不算独立验证。
        independent_delivery: 使用 friday_variation 且不给完整命令；学习者独立提交预测、动作、实际结果、解释、Runbook 证据和 2–4 句英语最终交付。

  - week: 13
    project:
      id: foundation-gate-incident
      goal: 在全新本地环境中独立完成权限、进程、网络和 HTTP 组合故障的基础阶段复测，并做路线规定的技术演示。
      environment: private/labs/YYYY-Www/ 中的本地裸远程、全新工作副本、回环服务和非特权 sandbox；所有门禁证据来自安全本地实验。
      starting_state: 教练提供服务契约、故障注入说明和空白交接记录；案例同时含一个根因和多个无关症状，学习者必须自行建立证据链。
      seed_files:
        README.md: |
          # Foundation gate incident
          Diagnose and recover the local loopback service without elevated privileges.
        service/contract.yml: |
          bind: 127.0.0.1
          port: 18081
          health_path: /health
          expected_status: 200
        incident/brief.md: |
          The local health check fails after a handoff. Preserve evidence before changing state.
        handoff/final.md: |
          # Final handoff
          Outcome, evidence, risk, and next action are pending.
      acceptance_criteria:
        - 无完整命令提示独立完成环境基线、单一假设、最小修复、回滚说明和复验。
        - 权限、进程、监听、名称与 HTTP 证据形成一致链路，且能排除噪声。
        - 总结性证据包含预测、学习者动作、实际结果和解释，达到门禁要求方可进入下一阶段。
        - 完成路线规定的技术演示和 2–4 句英语书面交接；日常训练不要求录音或发音证据。
      safety_boundaries:
        - 不使用管理员权限，不修改真实服务、系统网络、系统信任或学习系统仓库。
        - 只绑定回环地址，不执行外部扫描，不创建云资源或外部 GitHub 资源。
        - 不降低评分或阶段门禁；证据不足时安排重教或复测并延长路线。
      core_concepts:
        - 文件与目录权限、进程和服务边界
        - IP、DNS、端口、HTTP 与 TLS 分层诊断
        - Git 证据、Runbook、最小修复和英文异步交接
      friday_variation: 新副本把根因从不可执行脚本换成正确进程监听错误端口，同时保留误导性的旧权限错误日志；必须从实时证据重新判断。
    missions:
      - codename: Gate Preflight
        scenario: 基础门禁开始前，必须确认实验边界、服务契约、可用工具和证据保存位置，不能边做边猜验收标准。
        learning_goal: 独立建立安全基线并把成功标准转换为可观察证据。
        concept_prompt: 未确认健康路径和预期状态码时，仅看到端口监听能否定义门禁成功？
        guided_practice: 先讲解门禁证据与能力要求的对应关系，用示例演示证据整理；再带领学习者检查自己的材料，示范不能作为学习者的掌握证据。
        independent_delivery: 教练更换一个契约字段；学习者无完整命令独立建立基线，提交预测、方法、结果、解释和 2–4 句英语 preflight note。
      - codename: Integrated Triage
        scenario: 权限警告、旧日志和健康检查失败同时出现，学习者必须区分实时症状与历史噪声。
        learning_goal: 以时间、层次和影响为依据选择第一条高价值检查。
        concept_prompt: 旧日志出现 permission denied 是否足以证明当前健康检查仍由权限导致？
        guided_practice: 先示范如何选择可证伪假设和最小检查，讲解陌生命令；再带领学习者提出一条假设、预测区分证据并检验。
        independent_delivery: 新条件把噪声换成 DNS 警告；学习者独立进行分层诊断，提交动作、预测、结果、解释及 2–4 句英语 incident brief。
      - codename: Minimal Recovery
        scenario: 已定位根因，但多个操作都能暂时恢复服务，门禁要求最小影响、可回滚且不提权的方案。
        learning_goal: 根据证据选择修复范围并验证原始契约而非只验证命令成功。
        concept_prompt: 一个需要扩大权限但能恢复服务的方案是否优于无需提权的最小配置修正？
        guided_practice: 先用安全例子示范修复、影响检查与回滚，完整讲解命令和边界；再带领学习者选择方案并验证具体预期，不替其写最终结论。
        independent_delivery: 新条件禁止修改原文件而允许替换实验副本；学习者独立修复、预测、验证、解释，并写 2–4 句英语 change update。
      - codename: Technical Handoff
        scenario: 远程团队需要仅凭书面证据和技术演示理解影响、根因、修复、验证与剩余风险。
        learning_goal: 把命令输出转化为简洁、可审查的技术叙事，并准备路线规定的演示。
        concept_prompt: 交接只粘贴成功输出而不解释它验证了什么，是否足以让接手人复核结论？
        guided_practice: 先用示例讲清证据如何支撑结论并演示交接结构；再带领学习者组织自己的演示，不代写最终英文交付。
        independent_delivery: 教练要求面向不同接手角色重写重点；学习者独立交付证据解释、实际结果和剩余风险，并写 2–4 句英语 handoff，不要求录音证据。
      - codename: Foundation Gate Boss
        scenario: 最终复测在裸远程全新副本中注入变化故障，旧工作区、固定命令和完整提示均不可作为掌握证明。
        learning_goal: 独立完成基础阶段综合事故并以真实证据决定通过、重教或复测。
        concept_prompt: 如果变化题需要完整命令提示才能完成，是否已经达到独立门禁？
        guided_practice: 先讲清验收要求并用不同于考核题的案例示范，再带领练习；若独立阶段仍需完整帮助，退回带练并另出无提示变化题。
        independent_delivery: 使用 friday_variation，完全不给当前完整命令；学习者独立提交命令或方法、预测、实际结果、解释、回滚与复验，并写 2–4 句英语最终交付和完成技术演示。

starter_weeks:
  - week: 1
    missions:
      - codename: WSL Recon
        scenario: 你刚接手一台 Windows 工作站，需要确认 Linux 子系统是否可用于后续值班。
        objective: 建立 Windows、WSL、Shell 与 Ubuntu 的执行链路和环境基线。
        lab: 启动 WSL，执行 pwd、whoami、uname -a、ls，并说明每条输出能确认什么。
        english_output: Write a short environment handoff with the purpose, four checks, and one unknown.
      - codename: Command Anatomy
        scenario: 一条陌生命令失败了，团队只留下命令文本，没有说明选项、参数或退出状态。
        objective: 拆解命令、选项、参数、当前目录和退出码，判断失败发生在哪里。
        lab: 对 pwd、ls、echo、date 查看帮助并设计成功与失败命令，记录退出码和诊断。
        english_output: Write three sentences that distinguish a command, an option, an argument, and an exit code.
      - codename: Path Operations
        scenario: 发布文件散落在不同目录，必须在不触碰真实文件的前提下整理出正确结构。
        objective: 使用绝对路径、相对路径和安全文件操作整理 sandbox。
        lab: 用 cd、mkdir、touch、cp、mv 建立目录树，操作前后都用命令验证准确路径。
        english_output: Write a path handoff that names the source, destination, operation, and verification.
      - codename: Stream Incident
        scenario: 自动化任务失败，但普通输出文件是空的，值班人员怀疑错误信息去了其他通道。
        objective: 区分 stdin、stdout、stderr、重定向和管道，并恢复故障证据。
        lab: 在 sandbox 中使用 >、>>、2> 和管道，制造一次无害错误并验证各输出通道。
        english_output: Write an incident note explaining where stdout and stderr went and what fixed the diagnosis.
      - codename: Linux Basics Boss
        scenario: 基础环境即将交接，接手人要求在全新 sandbox 中看到完整、可重复且无隐私泄露的证据。
        objective: 独立整合环境侦察、命令结构、路径操作和输入输出，并完成周复盘。
        lab: 从空环境完成综合变化题，运行验证与隐私检查，记录最强证据和最大阻塞。
        english_output: Write the weekly handoff with the outcome, strongest evidence, unresolved risk, and next action.

  - week: 2
    missions:
      - codename: Wildcard Hunt
        scenario: 归档目录包含隐藏文件和相似扩展名，错误通配符可能把正式文件列入清理范围。
        objective: 用目录边界、find 谓词和精确通配符定位目标，并识别过宽匹配。
        lab: 创建含普通、隐藏、嵌套和相似后缀文件的 sandbox，比较精确与过宽查找结果。
        english_output: Write a search note with the intended target, exact pattern, broad-pattern risk, and result.
      - codename: Safe File Operations
        scenario: 值班清理需要复制、移动、重命名和删除文件，但任何误删都会破坏诊断证据。
        objective: 以预览、确认、操作、验证的顺序完成安全文件操作。
        lab: 在 sandbox 中执行 cp 和 mv；删除前用完全相同的 find 根路径和谓词先 -print 再 -delete。
        english_output: Write a change record with source, destination, preview, action, and verification.
      - codename: Log Search Incident
        scenario: 应用和归档日志同时出现大小写不同的错误标记，需要快速确定影响范围。
        objective: 区分 grep 的单文件搜索与 rg 的递归搜索，并验证大小写敏感差异。
        lab: 创建多层日志样本，用 grep、rg、-i 和行号选项定位错误，记录错误尝试和修正。
        english_output: Write a log-search handoff that explains command choice, case handling, matches, and conclusion.
      - codename: Link and Inode Case
        scenario: 配置文件存在软链接和硬链接，原始路径删除后团队不确定哪些引用仍然有效。
        objective: 使用 stat 和 inode 证据解释普通文件、软链接与硬链接的关系。
        lab: 在 sandbox 创建两种链接，对比路径、inode 和删除原路径前后的读取结果。
        english_output: Write a comparison of symbolic and hard links using observed evidence.
      - codename: Runbook Boss
        scenario: 新同事必须仅凭文档在第二个全新 sandbox 重现文件检索和安全操作流程。
        objective: 交付可重复的文件搜索 Runbook，并基于新证据完成周复盘。
        lab: 从零重跑 Runbook，完成独立变化题，核对固定路径、危险范围、预期与实际结果。
        english_output: Write the Runbook conclusion, one failure and diagnosis, verified result, and next improvement.

  - week: 3
    missions:
      - codename: Identity Recon
        scenario: 文件访问失败，但工单混淆了当前用户、文件所有者和所属组。
        objective: 用身份与所有权证据区分 user、group、owner 和访问主体。
        lab: 在 sandbox 使用 id、groups、ls -l 和 stat 建立身份与所有权基线。
        english_output: Write an access note that distinguishes the current user, owner, group, and affected path.
      - codename: RWX Repair
        scenario: 文件看似可读，但用户无法进入父目录，简单增加文件权限没有解决故障。
        objective: 分析 user/group/other 的 rwx 与文件、目录权限差异。
        lab: 用 chmod 符号和数字模式制造并修复安全权限案例，逐步验证最小改动。
        english_output: Write the symptom, permission evidence, minimal fix, and verification.
      - codename: Sudo Boundary
        scenario: 操作说明直接要求 sudo，但任务可能不需要 root，错误提权会扩大影响范围。
        objective: 判断何时需要 sudo，并优先设计无需提权的替代操作。
        lab: 只读检查 sudo 能力，在 sandbox 对比普通用户方案与提权风险，不修改真实系统。
        english_output: Write three rules using should, must, and must not for safe privilege use.
      - codename: Umask Investigation
        scenario: 新文件权限与团队预期不同，显式 chmod 记录中却没有异常。
        objective: 用基准权限和 umask 解释新文件与目录的默认权限。
        lab: 在隔离 shell 中比较两种 umask 的新文件和目录，计算并验证结果。
        english_output: Write a short explanation of how the observed umask changed default permissions.
      - codename: Permission Incident Boss
        scenario: 综合权限故障同时涉及身份、目录执行位、所有权和不必要的 sudo 建议。
        objective: 独立定位并以最小权限恢复访问，然后完成周复盘。
        lab: 从错误权限开始完成发现、假设、修复、回滚和变化题；达不到 4/5 不越过门禁。
        english_output: Write the incident timeline, root cause, least-privilege fix, evidence, and next priority.

  - week: 4
    missions:
      - codename: Process Recon
        scenario: 主机资源异常，需要先把程序文件、运行中进程、PID、父子关系和资源占用对应起来。
        objective: 建立测试进程基线并安全定位目标进程。
        lab: 启动无害测试进程，用 ps、pgrep 和 top 或等价只读命令定位并验证其状态。
        english_output: Write a process handoff with PID, parent, observed state, resource evidence, and next check.
      - codename: Service Incident
        scenario: 服务工单同时提到 status、restart 和 enable，但没有日志或变更窗口信息。
        objective: 区分运行状态、启动策略和日志证据，避免无依据重启。
        lab: 只读检查可用服务状态与近期日志，说明 status、start、restart 和 enable 的差异。
        english_output: Write a service update with current status, log evidence, safe action, and verification.
      - codename: Package Change
        scenario: 团队准备安装工具，但尚未确认软件源、版本、依赖、影响和回滚方式。
        objective: 在安装前完成软件包侦察和变更风险检查。
        lab: 查询已安装状态、候选版本、来源、依赖和包文件；不执行无关升级。
        english_output: Write a package change brief with source, version, dependencies, risk, and rollback.
      - codename: Integrated Diagnosis
        scenario: 一个无害测试故障表现为进程异常、端口占用和服务日志报错，需要形成证据链。
        objective: 综合进程、服务、软件包和日志完成诊断与恢复。
        lab: 在 sandbox 或安全本地实验中记录现象、时间线、假设、验证、修复和恢复检查。
        english_output: Write an incident timeline with impact, root cause, fix, rollback, and verification.
      - codename: Monthly Runbook Boss
        scenario: 第一个月进入交付门禁，另一位工程师要从空环境复现综合诊断并审查证据。
        objective: 完成月度 Runbook 综合挑战，以证据决定延长、保持或加速路线。
        lab: 在全新环境重跑 Runbook 和独立变化题，执行验证、链接和隐私检查，并完成月度复盘。
        english_output: Write the monthly handoff with outcomes, strongest evidence, knowledge gap, risk, and next-month priority.
